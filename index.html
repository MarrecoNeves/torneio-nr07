<style>
/* Layout: painel de plantão para projetor — placar no topo, pergunta ao centro, comandos do apresentador embaixo */
:root {
  --bg: #F3F6F5;
  --surface: #FFFFFF;
  --surface-2: #E6EEEC;
  --ink: #13201E;
  --ink-soft: #4E5F5B;
  --line: #C7D4D1;
  --accent: #0F766E;      /* equipe A, ações principais */
  --accent-ink: #FFFFFF;
  --rival: #B3402F;       /* equipe B */
  --gold: #B7811A;        /* sino, campeão */
  --ok: #0F766E;
  --bad: #B3402F;
  --focus: #C98B1C;
  --shadow: 0 1px 2px rgba(19,32,30,.08), 0 8px 24px rgba(19,32,30,.08);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1715; --surface: #16231F; --surface-2: #1E2F2B; --ink: #E9F1EF; --ink-soft: #A4B6B1; --line: #2E4440;
  --accent: #2BB3A3; --accent-ink: #062320; --rival: #EE7A63; --gold: #E5B34B; --ok: #2BB3A3; --bad: #EE7A63; --focus: #E5B34B;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1715; --surface: #16231F; --surface-2: #1E2F2B; --ink: #E9F1EF; --ink-soft: #A4B6B1; --line: #2E4440;
  --accent: #2BB3A3; --accent-ink: #062320; --rival: #EE7A63; --gold: #E5B34B; --ok: #2BB3A3; --bad: #EE7A63; --focus: #E5B34B;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* topo */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand svg { flex: none; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; letter-spacing: -.01em; }
.brand span { font-family: var(--f-mono); font-size: .78rem; color: var(--ink-soft); letter-spacing: .04em; }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: .92rem; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { background: var(--surface-2); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
kbd { font-family: var(--f-mono); font-size: .75em; border: 1px solid currentColor; border-radius: 5px; padding: 0 5px; opacity: .75; }

main { padding-block: 16px 32px; }
h1, h2, h3 { font-family: var(--f-display); letter-spacing: -.015em; text-wrap: balance; margin: 0; }
.eyebrow { font-family: var(--f-mono); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.muted { color: var(--ink-soft); }
.stack { display: grid; gap: 16px; }

/* configuração */
.setup { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 24px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-width: 0; }
.groups { display: grid; gap: 8px; }
.grow { display: grid; grid-template-columns: 3.2em minmax(0, 1fr) minmax(0, .8fr); gap: 8px; align-items: center; }
.grow .code { font-family: var(--f-mono); font-weight: 600; color: var(--ink-soft); font-size: .85rem; }
.grow input, .field input, .field select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.field { display: grid; gap: 4px; }
.field label { font-size: .85rem; color: var(--ink-soft); font-weight: 500; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: .92rem; }
.check input { margin-top: 4px; }
.rules { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: .95rem; }

/* chave */
.bracket-scroll { overflow-x: auto; padding-bottom: 8px; }
.bracket { display: grid; grid-template-columns: repeat(4, minmax(210px, 1fr)); gap: 22px; min-width: 900px; }
.col { display: flex; flex-direction: column; gap: 14px; }
.col h3 { font-family: var(--f-mono); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.col .slots { display: flex; flex-direction: column; justify-content: space-around; gap: 14px; flex: 1; }
.match { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-align: left; width: 100%; padding: 0; cursor: default; }
.match.ready { cursor: pointer; border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.match.ready:hover { background: var(--surface-2); }
.match .mh { display: flex; justify-content: space-between; padding: 6px 10px; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; color: var(--ink-soft); border-bottom: 1px solid var(--line); }
.match .tm { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 7px 10px; align-items: center; font-size: .92rem; }
.match .tm + .tm { border-top: 1px dashed var(--line); }
.match .tm .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.match .tm.win { font-weight: 700; }
.match .tm.lose { color: var(--ink-soft); text-decoration: line-through; text-decoration-thickness: 1px; }
.match .tm .s { font-family: var(--f-mono); font-weight: 600; }
.tbd { color: var(--ink-soft); font-style: italic; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .9rem; }

/* partida */
.board { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 14px; align-items: stretch; }
.team { border-radius: 18px; padding: 12px 16px; background: var(--surface); border: 2px solid var(--line); display: grid; gap: 8px; min-width: 0; position: relative; }
.team.a { border-color: var(--accent); }
.team.b { border-color: var(--rival); }
.team.rang { box-shadow: 0 0 0 6px color-mix(in srgb, var(--gold) 45%, transparent); }
.team .gname { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.15rem, 2.3vw, 1.9rem); line-height: 1.1; overflow-wrap: anywhere; }
.team.a .gname { color: var(--accent); }
.team.b .gname { color: var(--rival); }
.team .runner { border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 6px 8px; font-size: clamp(1rem, 1.8vw, 1.35rem); font-weight: 600; width: 100%; min-width: 0; }
.pips { display: flex; gap: 8px; align-items: center; }
.pip { width: 28px; height: 28px; border-radius: 50%; border: 3px solid currentColor; opacity: .35; }
.pip.on { opacity: 1; background: currentColor; }
.team.a .pips { color: var(--accent); }
.team.b .pips { color: var(--rival); }
.bonus { font-family: var(--f-mono); font-size: .85rem; color: var(--ink-soft); }
.vs { display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.4rem; color: var(--ink-soft); }
.vs small { display: block; font-family: var(--f-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; text-align: center; }

.qcard { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: clamp(18px, 3vw, 36px); position: relative; overflow: hidden; min-height: 0; display: grid; gap: 12px; align-content: start; }
.qmeta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.qtext { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.45rem, 3.2vw, 2.7rem); line-height: 1.15; max-width: 32ch; }
@media (min-width: 900px) { .qcard.stamped .qtext { padding-right: 310px; max-width: none; } }
.qhidden { display: grid; place-items: center; gap: 12px; min-height: 160px; text-align: center; }
.qhidden .big { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 4vw, 3rem); }
.timer { display: flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-weight: 600; font-size: 1.1rem; }
.ecg { flex: 1; min-width: 120px; height: 34px; }
.ecg path { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.ecg .bgline { stroke: var(--line); }
.timer.late .ecg path:not(.bgline) { stroke: var(--bad); }
.timer.late { color: var(--bad); }
.banner { border-radius: 14px; padding: 12px 16px; font-size: clamp(1.05rem, 2vw, 1.5rem); font-weight: 600; background: var(--surface-2); }
.banner.gold { background: color-mix(in srgb, var(--gold) 22%, var(--surface)); }
.answer { border-left: 0; border-radius: 14px; padding: 14px 16px; background: var(--surface-2); display: grid; gap: 4px; }
.answer .lbl { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.answer .val { font-size: clamp(1.2rem, 2.4vw, 1.9rem); font-weight: 600; }
.answer .ref { font-family: var(--f-mono); font-size: .9rem; color: var(--accent); }
.peek { font-family: var(--f-mono); font-size: .9rem; color: var(--ink-soft); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; }

.stamp { position: absolute; right: clamp(14px, 4vw, 48px); top: clamp(14px, 3vw, 34px); font-family: var(--f-mono); font-weight: 600; font-size: clamp(1.6rem, 4vw, 3.2rem); letter-spacing: .12em; padding: 6px 18px; border: 5px double currentColor; border-radius: 10px; transform: rotate(-8deg); opacity: .9; pointer-events: none; animation: stamp .35s cubic-bezier(.2,1.6,.4,1) both; }
.stamp.ok { color: var(--ok); }
.stamp.bad { color: var(--bad); }
@keyframes stamp { from { transform: rotate(-8deg) scale(2.2); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: .9; } }

.controls { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
.controls .btn { font-size: 1.05rem; padding: 12px 16px; border-radius: 12px; }
.btn.ta { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.tb { background: var(--rival); color: #fff; border-color: var(--rival); }
.btn.ok { background: var(--ok); color: var(--accent-ink); border-color: var(--ok); }
.btn.bad { background: var(--bad); color: #fff; border-color: var(--bad); }
.hint { font-size: .85rem; color: var(--ink-soft); margin-top: 8px; }

/* overlay vencedor */
.overlay { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(4px); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: clamp(20px, 4vw, 40px); max-width: 640px; width: 100%; display: grid; gap: 14px; text-align: center; }
.dialog .who { font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1.05; color: var(--accent); overflow-wrap: anywhere; }
.dialog .row { justify-content: center; }

/* ranking */
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
td.num, th.num { text-align: right; font-family: var(--f-mono); }
.champ { display: grid; gap: 6px; padding: 22px; border-radius: 18px; background: color-mix(in srgb, var(--gold) 18%, var(--surface)); border: 2px solid var(--gold); }
.champ .who { font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.05; overflow-wrap: anywhere; }

@media (max-width: 760px) {
  .setup { grid-template-columns: 1fr; }
  .board { grid-template-columns: 1fr; }
  .vs { padding: 4px 0; }
  .grow { grid-template-columns: 3em minmax(0, 1fr); }
  .grow input.rep { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { .stamp { animation: none; } * { transition: none !important; } }
</style>

    Q1: m("Q1", "Quartas", { t: seeds[0] }, { from: "P1" }),
    Q2: m("Q2", "Quartas", { t: seeds[1] }, { t: seeds[2] }),
    Q3: m("Q3", "Quartas", { t: seeds[3] }, { t: seeds[4] }),
    Q4: m("Q4", "Quartas", { t: seeds[5] }, { from: "P2" }),
    S1: m("S1", "Semifinal", { from: "Q1" }, { from: "Q2" }),
    S2: m("S2", "Semifinal", { from: "Q3" }, { from: "Q4" }),
    F: m("F", "Final", { from: "S1" }, { from: "S2" }),
  };
}
function fresh() {
  const seeds = shuffle(GROUPS0.map(g => g[0]));
  return {
    v: 1, view: "setup", started: false,
    groups: Object.fromEntries(GROUPS0.map(([id, name]) => [id, { id, name, rep: "" }])),
    seeds, matches: freshMatches(seeds),
    cfg: { toWin: 2, seconds: 20 },
    qOrder: shuffle(QUESTIONS.map((_, i) => i)), qPtr: 0,
    stats: Object.fromEntries(GROUPS0.map(([id]) => [id, { q: 0, w: 0, played: 0 }])),
    cur: null, // { id, stage, qi, rang, correct, revealedAt }

let S, history = [];
function load() { try { const raw = localStorage.getItem(STORE); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) return o; } } catch (e) {} return null; }
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }
function commit(fn) { history.push(JSON.stringify(S)); if (history.length > 80) history.shift(); fn(); save(); render(); }
function undo() { const prev = history.pop(); if (!prev) return; S = JSON.parse(prev); save(); render(); }

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const gname = id => id ? S.groups[id].name : "";
function side(m, k) { const s = m[k]; if (s.t) return s.t; const src = S.matches[s.from]; return src && src.winner ? src.winner : null; }
function srcLabel(m, k) { const s = m[k]; return s.from ? "Vencedor " + s.from : ""; }
function ready(m) { return !m.winner && side(m, "a") && side(m, "b"); }
function nextReady() { for (const r of ROUNDS) for (const id of r.ids) { const m = S.matches[id]; if (ready(m)) return m; } return null; }

// ---------- som ----------
let ac;
function tone(freqs, dur = .5, type = "sine", gain = .25) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = ac.currentTime;
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
      const st = t0 + i * .09; g.gain.setValueAtTime(gain, st); g.gain.exponentialRampToValueAtTime(.0001, st + dur);
      o.start(st); o.stop(st + dur + .05);
    });
  } catch (e) {}
}
const sBell = () => tone([1568, 2093], 1.1, "triangle", .3);
const sOk = () => tone([660, 880, 1175], .35, "sine", .22);
const sBad = () => tone([196, 147], .45, "sawtooth", .12);

// ---------- timer ----------
let tick = null;
function startTick() { stopTick(); tick = setInterval(() => { const el = $("#timer"); if (!el || !S.cur || S.cur.stage !== "question") return stopTick(); paintTimer(el); }, 200); }
function stopTick() { if (tick) clearInterval(tick); tick = null; }
function paintTimer(el) {
  const left = Math.max(0, S.cfg.seconds - (Date.now() - S.cur.revealedAt) / 1000);
  el.querySelector(".t").textContent = left > 0 ? Math.ceil(left) + " s" : "Tempo!";
  el.classList.toggle("late", left <= 5);
  const frac = left / S.cfg.seconds;
  el.querySelector(".prog").setAttribute("stroke-dasharray", (frac * 1000).toFixed(0) + " 1000");
}
const ECG = "M0 17 H80 L90 17 L96 6 L104 30 L112 2 L120 26 L126 17 H230 L240 17 L246 6 L254 30 L262 2 L270 26 L276 17 H400";

}

// ---------- ações ----------
function openMatch(id) {
  const m = S.matches[id]; if (!ready(m)) return;
  commit(() => {
    if (!m.runA) m.runA = S.groups[side(m, "a")].rep || "";
    if (!m.runB) m.runB = S.groups[side(m, "b")].rep || "";
    if (!S.started) S.started = true;
    S.cur = { id, stage: "idle", qi: null, rang: null, correct: null };
    S.view = "match";
  });
}
function takeQuestion() { if (S.qPtr >= S.qOrder.length) { S.qOrder = shuffle(QUESTIONS.map((_, i) => i)); S.qPtr = 0; } return S.qOrder[S.qPtr++]; }
function award(m, k, n) { if (k === "a") m.sa += n; else m.sb += n; }
function finishIfWon(m) {
  const A = side(m, "a"), B = side(m, "b");
  if (m.sa >= S.cfg.toWin || m.sb >= S.cfg.toWin) {
    m.winner = m.sa > m.sb ? A : B;
    S.stats[m.winner].w++; S.stats[A].played++; S.stats[B].played++;
    S.cur.stage = "done"; return true;
  }
  return false;
}
function act(a) {
  if (!S.cur) return;
  const c = S.cur, m = S.matches[c.id];
  const teamId = k => side(m, k);
  switch (a) {
    case "reveal": if (c.stage !== "idle") return; commit(() => { c.qi = takeQuestion(); c.stage = "question"; c.revealedAt = Date.now(); m.qs++; c.rang = null; c.correct = null; c.peek = false; }); break;
    case "ring-a": case "ring-b": if (c.stage !== "question") return; sBell(); commit(() => { c.rang = a === "ring-a" ? "a" : "b"; c.stage = "answer"; }); break;
    case "nobody": if (c.stage !== "question") return; commit(() => { c.rang = null; c.correct = null; c.stage = "result"; }); break;
    case "peek": if (c.stage !== "answer") return; c.peek = !c.peek; save(); render(); break;
    case "right": if (c.stage !== "answer") return; sOk(); commit(() => { c.correct = true; award(m, c.rang, 1); S.stats[teamId(c.rang)].q++; c.stage = "result"; }); break;
    case "wrong": if (c.stage !== "answer") return; sBad(); commit(() => { c.correct = false; const o = c.rang === "a" ? "b" : "a"; award(m, o, 1); S.stats[teamId(o)].q++; c.stage = "result"; }); break;
    case "next": if (c.stage !== "result") return; commit(() => { if (!finishIfWon(m)) { c.stage = "idle"; c.qi = null; c.rang = null; } }); if (S.cur.stage === "done") tone([523, 659, 784, 1047], .6, "triangle", .22); break;
    case "close-win": if (c.stage !== "done") return; commit(() => { const fin = c.id === "F"; S.cur = null; S.view = fin ? "rank" : "bracket"; }); break;
  }
}

// ---------- eventos ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-match], [data-view-go]");
  if (!t) return;
  if (t.dataset.view) { const v = t.dataset.view; commit(() => { S.view = v; if (v !== "match") {} }); return; }
  if (t.dataset.viewGo) { const v = t.dataset.viewGo; commit(() => { S.view = v; }); return; }
  if (t.dataset.match) { const m = S.matches[t.dataset.match]; if (m && m.winner == null && ready(m)) { if (S.cur && S.cur.id === m.id) { commit(() => { S.view = "match"; }); } else openMatch(m.id); } return; }
  if (t.dataset.act) { act(t.dataset.act); return; }
  switch (t.id) {
    case "draw": commit(() => { S.seeds = shuffle(S.seeds); S.matches = freshMatches(S.seeds); S.view = "bracket"; }); break;
    case "start": commit(() => { S.started = true; S.view = "bracket"; }); break;
    case "go-bracket": commit(() => { S.view = "bracket"; }); break;
    case "reset": askReset(); break;
    case "confirm-reset": { const keep = { groups: S.groups, cfg: S.cfg, sound: S.sound }; commit(() => { S = Object.assign(fresh(), keep); S.groups = keep.groups; }); break; }
    case "cancel-reset": $("#overlay-root").innerHTML = ""; break;
    case "btn-undo": undo(); break;
    case "btn-sound": S.sound = !S.sound; save(); render(); break;
    case "btn-theme": toggleTheme(); break;
    case "btn-full": full(); break;
  }
});
function askReset() {
  $("#overlay-root").innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="rs-h"><div class="dialog">
    <h2 id="rs-h">Reiniciar o torneio?</h2><p class="muted" style="margin:0">A chave é sorteada de novo e todos os placares voltam a zero. Os nomes dos grupos e de quem corre ficam.</p>
    <div class="row"><button class="btn bad" id="confirm-reset">Reiniciar</button><button class="btn" id="cancel-reset">Cancelar</button></div></div></div>`;
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.g) { S.groups[t.dataset.g][t.dataset.k] = t.value; save(); return; }
  if (t.dataset.run && S.cur) { const m = S.matches[S.cur.id]; m[t.dataset.run === "a" ? "runA" : "runB"] = t.value; save(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "cfg-sec") commit(() => { S.cfg.seconds = +t.value; });
  if (t.id === "cfg-win") commit(() => { S.cfg.toWin = +t.value; });
});
document.addEventListener("keydown", e => {
  if (e.target.matches("button") && (e.key === " " || e.key === "Enter")) return;
  if (e.target.matches("input, select, textarea") || e.ctrlKey || e.metaKey || e.altKey) { if (e.key === "Enter" && e.target.matches(".runner")) e.target.blur(); return; }
  const k = e.key.toLowerCase();
  if (k === "z") { undo(); e.preventDefault(); return; }
  if (k === "f") { full(); return; }
  if (S.view === "bracket" && k === " ") { const nr = nextReady(); if (nr) { e.preventDefault(); openMatch(nr.id); } return; }
  if (S.view !== "match" || !S.cur) return;
  const st = S.cur.stage;
  const map = { " ": st === "idle" ? "reveal" : st === "result" ? "next" : st === "done" ? "close-win" : null, "1": "ring-a", "2": "ring-b", "0": "nobody", c: "right", e: "wrong", g: "peek" };
  const a = map[k]; if (a) { e.preventDefault(); act(a); }
});
function toggleTheme() {
  const r = document.documentElement, cur = r.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem(STORE + "-theme", r.getAttribute("data-theme")); } catch (e) {}
}
function full() { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); } catch (e) {} }

function start(data) {
  S = (data && data.state) || load() || fresh();
  try { const th = localStorage.getItem(STORE + "-theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) {}
  render();
}
start({});
})();
</script>
